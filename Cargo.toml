[package]
name = "graphify-plugin-handoff"
version = "0.1.0"
edition = "2021"
description = "Graphify plugin: cross-session / cross-repo agent state relay (Code Relay handoff)"

[[bin]]
name = "graphify-plugin-handoff"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
